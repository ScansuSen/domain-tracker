server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real static file falls back to index.html so
    # React Router's client-side routes (e.g. a hard refresh on /favorites) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied to the api container under the same origin - matches VITE_API_BASE_URL=/api and
    # means the API needs no CORS policy here either, same reasoning as the Vite dev proxy.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
